server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Angular Router is registered (see app.config.ts) but app.routes.ts
    # is empty - the app switches views with signals, not URL paths - so this
    # fallback isn't handling real deep links today, just keeping a hard
    # refresh safe in case that ever changes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
